[project]
name = "bounded-agent-runtime"
version = "0.1.0"
description = "Durable bounded agent execution with explicit failure semantics"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "httpx>=0.28,<1", "prometheus-client>=0.21,<1", "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8",
  "hypothesis>=6.120,<7", "ruff>=0.9,<1", "mypy>=1.14,<3",
  "pip-audit>=2.7,<3", "pre-commit>=4,<5",
]
local = ["pgserver>=0.1,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires PostgreSQL", "concurrency: real concurrent PostgreSQL transactions",
  "failure: deterministic crash and persistence faults", "security: trust boundary checks",
  "contract: API and provider contract", "eval: deterministic runtime policy regression",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "class .*\\bProtocol\\):", "raise NotImplementedError"]
